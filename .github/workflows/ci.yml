name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Render the chart
        run: |
          helm repo add kong https://charts.konghq.com
          helm template kong kong/ingress --namespace kong -f helm/values-base.yaml -f helm/values-dev.yaml > /dev/null
          helm template kong kong/ingress --namespace kong -f helm/values-base.yaml -f helm/values-prod.yaml > /dev/null

      - name: Validate the QA gateway configuration
        run: |
          docker run --rm -v "$PWD/kong:/kong" -e KONG_DATABASE=off kong:3.9.3 kong config parse /kong/kong.qa.yml
