_format_version: "3.0"

plugins:
  - name: correlation-id
    config:
      header_name: X-Request-Id
      generator: uuid
      echo_downstream: true
  - name: cors
    config:
      origins:
        - http://localhost:5173
        - http://localhost:3000
        - https://qa.solarianetwork.site
        - https://web-app-ldi0.onrender.com
        - https://web-sandbox-qa.onrender.com
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Authorization
        - Content-Type
        - Accept
        - X-Request-Id
      exposed_headers:
        - X-Request-Id
      credentials: false
      max_age: 3600

services:
  - name: health
    url: http://localhost:8001
    routes:
      - name: health
        paths:
          - /health
        strip_path: false
    plugins:
      - name: request-termination
        config:
          status_code: 200
          content_type: application/json
          body: '{"status":"UP"}'

  - name: api-auth
    url: https://api-auth-xw6o.onrender.com
    routes:
      - name: api-auth
        paths:
          - /api-auth
        strip_path: true

  - name: api-core
    url: https://api-core-cqfn.onrender.com
    routes:
      - name: api-core
        paths:
          - /api-core
        strip_path: true

  - name: api-messenger
    url: https://api-messenger-5g2n.onrender.com
