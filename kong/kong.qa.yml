_format_version: "3.0"

plugins:
  - name: correlation-id
    config:
      header_name: X-Request-Id
      generator: uuid
      echo_downstream: true

services:
  - name: health
    url: http://localhost:8001
    routes:
      - name: health
        paths:
          - /health
        strip_path: false
    plugins:
      - name: request-termination
        config:
          status_code: 200
          content_type: application/json
          body: '{"status":"UP"}'

  - name: api-auth
    url: https://api-auth-xw6o.onrender.com
    routes:
      - name: api-auth
        paths:
          - /api-auth
        strip_path: true

  - name: api-core
